[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragmate"
version = "0.1.0"
description = "Chat with your documents. Fast, local, free."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "google-genai>=1.0.0",
    "chromadb>=0.5.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.0",
    "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ragmate"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ragmate.api.routes.*", "ragmate.main"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=ragmate --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "ragmate/__main__.py"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
