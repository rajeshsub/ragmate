name: Deploy to HF Spaces

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://rajeshsub:$HF_TOKEN@huggingface.co/spaces/rajeshsub/ragmate hf-space

          cp -r ragmate hf-space/
          cp Dockerfile pyproject.toml LICENSE hf-space/
          cp hf_README.md hf-space/README.md

          cd hf-space
          git add .
          git diff --staged --quiet || git commit -m "Deploy ${{ github.sha }}"
          git push
