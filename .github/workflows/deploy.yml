name: Deploy to HF Spaces

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://rajeshsub:$HF_TOKEN@huggingface.co/spaces/rajeshsub/ragmate hf-space

          cp -r ragmate hf-space/
          cp Dockerfile pyproject.toml LICENSE requirements-lock.txt hf-space/
          cp hf_README.md hf-space/README.md

          cd hf-space
          git add .
          echo "=== staged diff ==="
          git diff --staged --stat
          echo "=== status ==="
          git status --short
          if git diff --staged --quiet; then
            echo "No changes to deploy - Space is already up to date"
          else
            git commit -m "Deploy ${{ github.sha }}"
            git push
            echo "Deployed successfully"
          fi
