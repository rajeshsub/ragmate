name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check ragmate tests

      - name: Format check (black)
        run: black --check ragmate tests

      - name: Type check (mypy)
        run: mypy ragmate

      - name: Security scan (bandit)
        run: bandit -r ragmate -c pyproject.toml

      - name: Tests + coverage
        env:
          GEMINI_API_KEY: test-gemini-key
          API_KEY: test-api-key
        run: pytest --cov=ragmate --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ragmate:${{ github.sha }} .
